name: Melonn
description: >-
  Melonn is a third-party logistics (3PL) and multichannel fulfillment operator
  for e-commerce businesses across Colombia and Mexico. Through its proprietary
  Órbita platform it centralizes inventory, processes and packs orders, manages
  returns, and offers same/next-day delivery, unifying multiple sales channels
  into a single operation. Melonn connects to platforms such as Shopify, VTEX,
  WooCommerce, Magento, PrestaShop, MercadoLibre, Amazon, Walmart, Rappi, TikTok
  Shop, Liverpool, and Coppel, and exposes a REST API with real-time webhooks so
  any external platform can drive order management, inventory queries, shipment
  tracking, and returns. Melonn was surfaced as a portfolio company of QED
  Investors. Public developer documentation and a sandbox are provided on request
  via the Melonn advisory/contact form rather than an open developer portal.
